name: Update DART Financial Data

on:
  schedule:
    # 매주 월요일 자정(UTC 기준, 한국 시간 월요일 오전 9시)에 자동 실행
    - cron: '0 0 * * 1'
  workflow_dispatch: # 웹(GitHub Actions 탭)에서 수동으로도 실행 가능하게 설정

permissions:
  contents: write # 레포지토리 파일 자동 커밋·푸시 권한 허용

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      # 1. 레포지토리 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필요한 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 파이썬 스크립트 실행 (GitHub Secrets에서 API 키를 안전하게 주입)
      - name: Run update script
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python update_corps.py

      # 5. 변경된 JSON 파일(data/corps_data.json)이 있다면 Git에 자동 커밋 및 푸시
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corps_data.json
          git diff --staging --quiet || git commit -m "Auto-update DART financial data [skip ci]"
          git push